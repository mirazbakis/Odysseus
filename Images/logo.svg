<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A5578"/>
      <stop offset="0.45" stop-color="#16213A"/>
      <stop offset="1" stop-color="#03050B"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.3" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#BFD3F2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#BFD3F2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="sail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE7F8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.75  0 0 0 0 0.83  0 0 0 0 0.95  0 0 0 0.55 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#moon)"/>

  <!-- soft ring -->
  <circle cx="512" cy="512" r="372" fill="#FFFFFF" fill-opacity="0.035"/>
  <circle cx="512" cy="512" r="372" fill="none" stroke="url(#ring)" stroke-width="10"/>

  <g filter="url(#glow)">
    <!-- mast -->
    <rect x="504" y="262" width="16" height="352" rx="8" fill="#FFFFFF"/>
    <!-- pennant -->
    <path d="M520 266 L588 284 L520 302 Z" fill="#FFFFFF"/>
    <!-- billowing square sail -->
    <path d="M372 322 Q512 304 652 322 Q676 436 640 548 Q512 528 384 548 Q348 436 372 322 Z" fill="url(#sail)"/>
    <!-- sail seams -->
    <path d="M378 392 Q512 376 646 392" fill="none" stroke="#16213A" stroke-opacity="0.18" stroke-width="7" stroke-linecap="round"/>
    <path d="M374 466 Q512 450 650 466" fill="none" stroke="#16213A" stroke-opacity="0.18" stroke-width="7" stroke-linecap="round"/>
    <!-- hull with curled prow and stern -->
    <path d="M318 612 L706 612 Q690 690 612 700 L412 700 Q334 690 318 612 Z" fill="#FFFFFF"/>
    <path d="M318 612 Q282 586 296 552 Q306 532 326 544" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <path d="M706 612 Q748 584 738 548 Q730 524 708 536" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round"/>
    <!-- oar ports -->
    <g fill="#16213A" fill-opacity="0.35">
      <circle cx="430" cy="648" r="9"/><circle cx="478" cy="648" r="9"/>
      <circle cx="526" cy="648" r="9"/><circle cx="574" cy="648" r="9"/>
    </g>
  </g>

  <!-- waves -->
  <path d="M292 752 q37 -24 74 0 t74 0 t74 0 t74 0 t74 0 t74 0" fill="none" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="15" stroke-linecap="round"/>
  <path d="M352 800 q40 -20 80 0 t80 0 t80 0 t80 0" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="12" stroke-linecap="round"/>

  <!-- north star sparkle -->
  <path d="M700 262 Q704 290 728 294 Q704 298 700 326 Q696 298 672 294 Q696 290 700 262 Z" fill="#FFFFFF"/>
  <circle cx="330" cy="300" r="5" fill="#FFFFFF" fill-opacity="0.7"/>
  <circle cx="752" cy="392" r="4" fill="#FFFFFF" fill-opacity="0.5"/>
</svg>
